name: Feature request
description: Propose a new capability or improvement for this repository.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Each harmflow repository tracks its own issues: file this where the work lands. A change that also needs a
        spec, an ADR, or an architecture update gets a matching issue in the private documentation repository, which
        links this one. Never cite private records here by ID, link, or path: describe what the work needs in plain
        words.

        An issue is `ready-for-agent` once the problem, the outcome, and the acceptance criteria are concrete
        enough to implement without further questions.
  - type: textarea
    id: motivation
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
      placeholder: Describe the need or workflow gap, not the implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true once this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions that close the issue.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: Related issues
      description: Public issues, in full form for another repository. Never a private record or issue.
      placeholder: e.g. #12, harmflow/harmflow-site#42
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, examples, data, or screenshots.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I described the problem and outcome, not only a preferred implementation.
          required: true

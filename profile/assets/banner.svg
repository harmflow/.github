<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img"
     aria-labelledby="banner-title banner-desc">
  <title id="banner-title">HarmFlow</title>
  <desc id="banner-desc">Local-first automation manager for AI coding agents: schedule, run, monitor, resume.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse  { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .wave-a { animation: drift-a 6s linear infinite; }
    .wave-b { animation: drift-b 9s linear infinite; }
    .wave-c { animation: drift-c 13s linear infinite; }
    .packets { animation: packets 2.2s linear infinite; }

    @keyframes blink   { 50% { opacity: 0; } }
    @keyframes pulse   { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes drift-a { to { transform: translateX(-240px); } }
    @keyframes drift-b { to { transform: translateX(-320px); } }
    @keyframes drift-c { to { transform: translateX(-400px); } }
    @keyframes packets { to { stroke-dashoffset: -80; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .pulse, .wave-a, .wave-b, .wave-c, .packets { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="18"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a15"/>
      <stop offset="1" stop-color="#0d1328"/>
    </linearGradient>
    <radialGradient id="glow-cyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-magenta">
      <stop offset="0" stop-color="#e040fb" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e040fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1280" height="360" fill="url(#grid-fade)"/>
    </mask>

    <linearGradient id="flow-text" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>

    <linearGradient id="wave-fade" gradientUnits="userSpaceOnUse" x1="740" y1="0" x2="1250" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wave-mask">
      <rect x="740" y="0" width="510" height="360" fill="url(#wave-fade)"/>
    </mask>

    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background, ambient glow, grid -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="150" cy="30" r="420" fill="url(#glow-cyan)"/>
    <circle cx="1180" cy="340" r="420" fill="url(#glow-magenta)"/>
    <circle cx="900" cy="40" r="260" fill="url(#glow-violet)"/>
    <rect width="1280" height="360" fill="url(#grid)" mask="url(#grid-mask)"/>

    <!-- Flowing waves -->
    <g mask="url(#wave-mask)" fill="none" stroke-linecap="round">
      <g class="wave-c">
        <path stroke="#e040fb" stroke-opacity=".45" stroke-width="2"
              d="M360 190q100 -124 200 0t200 0t200 0t200 0t200 0t200 0t200 0"/>
      </g>
      <g class="wave-b">
        <path stroke="#8b5cf6" stroke-opacity=".7" stroke-width="2.5"
              d="M440 190q80 -64 160 0t160 0t160 0t160 0t160 0t160 0t160 0"/>
      </g>
      <g class="wave-a" filter="url(#glow)">
        <path stroke="#22d3ee" stroke-width="3"
              d="M520 190q60 -92 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0"/>
        <path class="packets" stroke="#e0fbff" stroke-width="6" stroke-dasharray="1 79"
              d="M520 190q60 -92 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0"/>
      </g>
    </g>

    <!-- HUD corners -->
    <g fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2">
      <path d="M24 56V24H56"/>
      <path d="M1224 24H1256V56"/>
      <path d="M24 304V336H56"/>
      <path d="M1256 304V336H1224"/>
    </g>

    <!-- Prompt -->
    <text x="64" y="78" class="mono" font-size="16" letter-spacing="3" fill="#22d3ee">&gt;_ AGENT ORCHESTRATION<tspan
        class="cursor" fill="#22d3ee"> &#x258C;</tspan></text>

    <!-- Status chip -->
    <rect x="1010" y="52" width="214" height="40" rx="20" fill="#0f1729" stroke="#f59e0b" stroke-opacity=".5"/>
    <circle class="pulse" cx="1036" cy="72" r="5" fill="#f59e0b"/>
    <circle cx="1036" cy="72" r="5" fill="#f59e0b"/>
    <text x="1052" y="77" class="mono" font-size="14" letter-spacing="1.5" fill="#fcd34d">IN DEVELOPMENT</text>

    <!-- Wordmark -->
    <g class="sans" font-size="108" font-weight="800" letter-spacing="-2">
      <text x="60" y="206" fill="#22d3ee" opacity=".35" filter="url(#blur)">HarmFlow</text>
      <text x="60" y="206"><tspan fill="#eef4ff">Harm</tspan><tspan fill="url(#flow-text)">Flow</tspan></text>
    </g>

    <!-- Tagline -->
    <text x="64" y="256" class="sans" font-size="25" fill="#b8c4dc">Local-first automation manager for AI coding agents.</text>
    <text x="64" y="304" class="mono" font-size="14" letter-spacing="3" fill="#7d8bab">SCHEDULE <tspan
        fill="#22d3ee">&#x2192;</tspan> RUN <tspan fill="#8b5cf6">&#x2192;</tspan> MONITOR <tspan
        fill="#e040fb">&#x2192;</tspan> RESUME</text>

    <!-- Neon bottom edge -->
    <rect x="0" y="356" width="1280" height="4" fill="url(#edge)" opacity=".85"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".18"/>
</svg>
